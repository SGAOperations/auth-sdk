# Publishes @nusgaops/sgauth to the public npm registry when a v* tag is
# pushed. Authentication is npm trusted publishing: npm exchanges this job's
# GitHub OIDC token, so no npm token exists anywhere. Provenance comes from
# publishConfig.provenance in package.json.
#
# The trusted publisher on npmjs.com is bound to this repository, this file
# name, and the npm-publish environment. Renaming any of them breaks publishing.
#
# Both actions are pinned to full commit SHAs because this job holds
# id-token: write.

name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Tag a commit on main."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:package
      - run: node scripts/smoke-pack.mjs

      - name: Release check
        id: check
        run: node scripts/release-check.mjs

      - run: npm publish --tag "${{ steps.check.outputs.dist-tag }}"
